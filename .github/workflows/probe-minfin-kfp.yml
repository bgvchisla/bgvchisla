name: Inspect official Ministry of Finance KFP workbook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_minfin_kfp.py", ".github/workflows/probe-minfin-kfp.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/probe_minfin_kfp.py
