name: Test and save official economic data

on:
  push:
    branches:
      - development
    paths:
      - "scripts/update_economy.py"
      - "economy.json"
      - ".github/workflows/test-economy.yml"

permissions:
  contents: write

concurrency:
  group: economy-development
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Eurostat data
        run: python scripts/update_economy.py

      - name: Validate downloaded series
        run: |
          python - <<'PY'
          import json

          with open("economy.json", encoding="utf-8") as file:
              data = json.load(file)

          series = next(
              row for row in data["series"]
              if row["id"] == "gdp_per_capita_current_eur"
          )

          points = series["points"]
          if len(points) < 2:
              raise RuntimeError("Недостатъчно годишни данни.")

          years = [point["year"] for point in points]
          if years != sorted(set(years)):
              raise RuntimeError("Неподредени или дублирани години.")

          print("Източник:", series["source"])
          print("Брой години:", len(points))
          print("Последна година:", points[-1]["year"])
          print("Последна стойност:", points[-1]["value"])
          PY

      - name: Save validated data to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economy.json
          if git diff --cached --quiet; then
            echo "No file changes to save."
          else
            git commit -m "Update official Eurostat series"
            git push origin HEAD:development
          fi
