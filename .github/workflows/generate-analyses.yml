name: Generate weekly editorial analysis drafts

on:
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      lane:
        description: "Редакционен фокус"
        required: true
        default: "bulgaria"
        type: choice
        options: [bulgaria, world]
      mode:
        description: "Режим"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, draft]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: editorial-analysis
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decompress checked-in generator
        run: gzip -dc scripts/generate_analysis.py.gz > scripts/generate_analysis.py
      - name: Apply checked editorial evidence selector
        run: python scripts/patch_analysis_evidence.py
      - name: Compile generator and evidence selector
        run: python -m py_compile scripts/generate_analysis.py scripts/analysis_evidence.py
      - name: Resolve editorial lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 7 * * 2" ]; then LANE="bulgaria"; else LANE="world"; fi
          else
            LANE="${MANUAL_LANE:-bulgaria}"
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
      - name: Free evidence and budget preflight
        run: python scripts/generate_analysis.py --lane "${{ steps.lane.outputs.lane }}" --dry-run
      - name: Check explicit paid auto-draft switch and API secret
        id: api
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_DRAFT_ENABLED: ${{ vars.ANALYSES_AUTODRAFT_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          REQUESTED_DRAFT=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MANUAL_MODE" = "draft" ]; then
            REQUESTED_DRAFT=true
          fi
          if [ "$REQUESTED_DRAFT" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run selected. No paid model call will run."
          elif [ -z "$API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured. No paid model call will run."
          elif [ "$AUTO_DRAFT_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANALYSES_AUTODRAFT_ENABLED is not true. Paid draft generation remains disabled."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Paid generation is enabled for a review-only pull request. Direct publication is disabled."
          fi
      - name: Generate and validate article draft
        if: steps.api.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_analysis.py --lane "${{ steps.lane.outputs.lane }}"
      - name: Open a review pull request instead of writing to main
        if: steps.api.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          set -euo pipefail
          BRANCH="analysis/draft-${LANE}-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add analizi sitemap.xml analysis/monthly_usage.json
          if git diff --cached --quiet; then
            echo "No validated article or archive changes were produced."
            exit 0
          fi
          git commit -m "Draft editorial analysis for review"
          git push --set-upstream origin "$BRANCH"
          if [ "$LANE" = "bulgaria" ]; then
            TITLE="Чернова: авторски анализ за България"
          else
            TITLE="Чернова: световна икономика и финансови пазари"
          fi
          cat > /tmp/pr-body.md <<'EOF'
          ## Автоматично подготвена редакционна чернова

          Този PR е етап за преглед и редакция. Той **не публикува** материала при създаването си.

          - Доказателствената база е преминала безплатния предварителен подбор.
          - Текстът и източниците са записани в отделен branch.
          - Всеки commit по PR трябва да премине проверката `audit`.
          - Редакторът може да редактира файловете директно в този PR; проверките се изпълняват отново.

          **Публикуване:** след преглед напиши точно `/approve` в дискусията на този PR от собственика на хранилището. Workflow ще провери, че PR е към `main`, че branch-ът е редакционна чернова и че `audit` е успешно за точния commit. Едва тогава ще слее PR и ще стартира production deployment.

          Не използвай директен merge, ако искаш да се изпълни автоматичната проверка за одобрение.
          EOF
          PR_URL="$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md)"
          echo "Review PR created: $PR_URL"
          # Pull requests created with GITHUB_TOKEN do not automatically trigger pull_request workflows.
          # Dispatch the audit explicitly for this exact branch so its check is attached to the PR head SHA.
          gh workflow run audit-analysis-evidence.yml --repo "$REPOSITORY" --ref "$BRANCH"
          echo "Dispatched audit for $BRANCH"
