name: Generate weekly editorial analyses

on:
  push:
    branches: [main]
    paths:
      - "analysis/DRY_RUN_TRIGGER"
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      lane:
        description: "Редакционен фокус"
        required: true
        default: "bulgaria"
        type: choice
        options: [bulgaria, world]
      mode:
        description: "Режим"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, publish]

permissions:
  contents: write

concurrency:
  group: editorial-analysis
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decompress checked-in generator
        run: gzip -dc scripts/generate_analysis.py.gz > scripts/generate_analysis.py
      - name: Normalize BNB series mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/generate_analysis.py")
          source = path.read_text(encoding="utf-8")
          old = "facts=[{'id':x.get('id'),'label':clean(x.get('title') or x.get('label') or x.get('id')),'unit':x.get('unit'),'points':x.get('points',[])[-6:]} for x in data.get('series',[])[:8] if x.get('points')]"
          new = "facts=[{'id':x.get('id'),'label':clean(x.get('title') or x.get('label') or x.get('id')),'unit':x.get('unit'),'points':x.get('points',[])[-6:]} for x in (data.get('series',[]) if isinstance(data.get('series',[]),list) else [dict(v,id=k) for k,v in data.get('series',{}).items()])[:8] if x.get('points')]"
          if source.count(old) != 1:
              raise SystemExit("Expected one BNB series extraction expression; found " + str(source.count(old)))
          path.write_text(source.replace(old, new), encoding="utf-8")
          print("BNB series extraction now accepts both list and mapping structures.")
          PY
      - name: Resolve editorial lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 7 * * 2" ]; then LANE="bulgaria"; else LANE="world"; fi
          else
            LANE="${MANUAL_LANE:-bulgaria}"
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
      - name: Free evidence and budget preflight
        env:
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          nl -ba scripts/generate_analysis.py | sed -n '45,75p;130,175p'
          python - <<'PY'
          import runpy
          import sys
          def trace(frame, event, arg):
              if event == "exception":
                  exc_type, exc, tb = arg
                  if exc_type is not KeyboardInterrupt:
                      print(f"TRACE_EXCEPTION {frame.f_code.co_filename}:{frame.f_lineno} {exc_type.__name__}: {exc}")
              return trace
          sys.settrace(trace)
          sys.argv = ["scripts/generate_analysis.py", "--lane", __import__("os").environ["LANE"], "--dry-run"]
          runpy.run_path("scripts/generate_analysis.py", run_name="__main__")
          PY
      - name: Persist validated generator correction
        if: success()
        run: |
          gzip -n -c scripts/generate_analysis.py > /tmp/generate_analysis.py.gz
          mv /tmp/generate_analysis.py.gz scripts/generate_analysis.py.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_analysis.py.gz
          if git diff --cached --quiet; then
            echo "Generator compression is already current."
          else
            git commit -m "Fix BNB series handling in analysis generator"
            git push origin HEAD:main
          fi
      - name: Check explicit publishing switch and API secret
        id: api
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUBLISH_ENABLED: ${{ vars.ANALYSES_PUBLISH_ENABLED }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured. No paid generation will run."
          elif [ "$PUBLISH_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANALYSES_PUBLISH_ENABLED is not true. The workflow remains in free dry-run mode."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate article
        if: steps.api.outputs.enabled == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_analysis.py --lane "${{ steps.lane.outputs.lane }}"
      - name: Commit validated article and usage ledger
        if: steps.api.outputs.enabled == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analizi sitemap.xml analysis/monthly_usage.json
          if git diff --cached --quiet; then echo "No validated article to publish."; else git commit -m "Publish validated editorial analysis" && git push origin HEAD:main; fi
