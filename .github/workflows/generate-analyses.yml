name: Generate and publish weekly editorial analyses

on:
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      lane:
        description: "Редакционен фокус"
        required: true
        default: "bulgaria"
        type: choice
        options: [bulgaria, world]
      mode:
        description: "Режим"
        required: true
        default: "preflight"
        type: choice
        options: [preflight, publish]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: write

concurrency:
  group: editorial-analysis
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current production baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare generator and strict evidence selector
        run: |
          set -euo pipefail
          gzip -dc scripts/generate_analysis.py.gz > scripts/generate_analysis.py
          python scripts/patch_analysis_evidence.py
          python -m py_compile scripts/generate_analysis.py scripts/analysis_evidence.py

      - name: Resolve scheduled lane and execution mode
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_LANE: ${{ inputs.lane }}
          MANUAL_MODE: ${{ inputs.mode }}
          PUBLISH_ENABLED: ${{ vars.ANALYSES_PUBLISH_ENABLED }}
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
          GEMINI_KEY_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          set -euo pipefail
          REASON=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 7 * * 2") LANE="bulgaria" ;;
              "0 7 * * 5") LANE="world" ;;
              *) echo "::error::Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
            if [ "$PUBLISH_ENABLED" = "true" ] && [ "$OPENAI_KEY_PRESENT" = "true" ] && [ "$GEMINI_KEY_PRESENT" = "true" ]; then
              MODE="publish"
            else
              MODE="preflight"
              REASON="Платеното публикуване е изключено или липсва някой от двата API ключа."
            fi
          else
            LANE="${MANUAL_LANE:-bulgaria}"
            REQUESTED_MODE="${MANUAL_MODE:-preflight}"
            if [ "$REQUESTED_MODE" = "publish" ]; then
              if [ "$PUBLISH_ENABLED" != "true" ] || [ "$OPENAI_KEY_PRESENT" != "true" ] || [ "$GEMINI_KEY_PRESENT" != "true" ]; then
                echo "::error::За платен режим са необходими ANALYSES_PUBLISH_ENABLED=true и двата ключа OPENAI_API_KEY и GEMINI_API_KEY."
                exit 1
              fi
              MODE="publish"
            else
              MODE="preflight"
            fi
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Capture article registry before generation
        if: steps.plan.outputs.mode == 'publish'
        run: cp analizi/articles.json /tmp/articles-before.json

      - name: Free evidence and budget preflight
        run: python scripts/generate_analysis.py --lane "${{ steps.plan.outputs.lane }}" --dry-run

      - name: Require both API keys and explicit publishing gate
        if: steps.plan.outputs.mode == 'publish'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLISH_ENABLED: ${{ vars.ANALYSES_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test -n "$GEMINI_API_KEY"
          test "$PUBLISH_ENABLED" = "true"
          echo "Изричният издателски флаг и двата независими API ключа са налични."

      - name: Generate the analysis with GPT-6 Luna
        id: generation
        if: steps.plan.outputs.mode == 'publish'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANE: ${{ steps.plan.outputs.lane }}
        run: |
          set -euo pipefail
          python scripts/generate_analysis.py --lane "$LANE"

      - name: Apply the visible AI transparency disclosure
        if: steps.plan.outputs.mode == 'publish'
        env:
          LANE: ${{ steps.plan.outputs.lane }}
        run: python scripts/apply_ai_disclosure.py --lane "$LANE" --before /tmp/articles-before.json

      - name: Validate the new article, its sources and its design
        id: article
        if: steps.plan.outputs.mode == 'publish'
        env:
          LANE: ${{ steps.plan.outputs.lane }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, os, re
          from pathlib import Path

          before = json.loads(Path("/tmp/articles-before.json").read_text(encoding="utf-8"))
          rows = json.loads(Path("analizi/articles.json").read_text(encoding="utf-8"))
          old = {str(x.get("slug", "")) for x in before}
          lane = os.environ["LANE"]
          new = [x for x in rows if str(x.get("slug", "")) not in old and x.get("lane") == lane]
          if len(new) != 1:
              raise SystemExit(f"Очаква се точно един нов анализ за {lane}; намерени: {len(new)}.")
          row = new[0]
          slug = str(row.get("slug", ""))
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("Невалиден slug.")
          urls = row.get("source_urls", [])
          if len(urls) < 4 or any(not str(u).startswith("https://") for u in urls):
              raise SystemExit("Недостатъчни или незащитени първоизточници.")
          path = Path("analizi") / slug / "index.html"
          if not path.is_file():
              raise SystemExit(f"Липсва HTML страницата: {path}")
          page = path.read_text(encoding="utf-8")
          for token in (
              '<html lang="bg"',
              f'<link rel="canonical" href="https://bgvchisla.com/analizi/{slug}/">',
              'property="og:title"', 'property="og:description"', "<h1>", "<article>",
              "--navy:#24384f", "--blue:#315f91", "--risk:#b64b45", "@media(max-width:640px)",
              'class="ai-disclosure"', "data-ai-generated=\"true\"",
          ):
              if token not in page:
                  raise SystemExit(f"Липсва задължителен HTML/SEO/design елемент: {token}")
          match = re.search(r"<article>([\s\S]*?)</article>", page, flags=re.I)
          if not match:
              raise SystemExit("Липсва основното тяло на анализа.")
          body = html.unescape(re.sub(r"<[^>]+>", " ", match.group(1)))
          words = re.findall(r"[^\W_]+(?:[’'-][^\W_]+)*", body, flags=re.UNICODE)
          if not 900 <= len(words) <= 1400:
              raise SystemExit(f"Дължината е извън стандарта: {len(words)} думи.")
          refs = set(re.findall(r'href="#source-(\d+)"', page))
          notes = set(re.findall(r'<li id="source-(\d+)"', page))
          if not refs or not refs.issubset(notes) or len(notes) < 4:
              raise SystemExit("Препратките към първоизточниците са непълни.")
          if f'href="/analizi/{slug}/"' not in Path("analizi/index.html").read_text(encoding="utf-8"):
              raise SystemExit("Новият материал липсва от архива.")
          if f"https://bgvchisla.com/analizi/{slug}/" not in Path("sitemap.xml").read_text(encoding="utf-8"):
              raise SystemExit("Новият материал липсва от sitemap.xml.")
          for char in ("\u2012", "\u2013", "\u2014", "\u2015"):
              if char in page:
                  raise SystemExit("Открито е забранено дълго тире.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"slug={slug}\n")
              out.write(f"title={row['title'].replace(chr(10), ' ').strip()}\n")
              out.write(f"words={len(words)}\n")
              out.write(f"sources={len(urls)}\n")
          print(f"Проверен материал: {row['title']} | {len(words)} думи | {len(urls)} източника")
          PY
          python scripts/test_analysis_publication.py
          python scripts/analysis_evidence.py --lane "$LANE"
          git diff --check
          python -m json.tool analizi/articles.json >/dev/null
          python -m json.tool analysis/monthly_usage.json >/dev/null

      - name: Run independent Gemini fact-check against primary-source URLs (URL Context)
        id: factcheck
        if: steps.plan.outputs.mode == 'publish'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANALYSES_PUBLISH_ENABLED: ${{ vars.ANALYSES_PUBLISH_ENABLED }}
          LANE: ${{ steps.plan.outputs.lane }}
          SLUG: ${{ steps.article.outputs.slug }}
        run: python scripts/fact_check_analysis.py --slug "$SLUG" --report analysis/factcheck_report.json

      - name: Create a technical PR for the generated revision
        id: pr
        if: steps.plan.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LANE: ${{ steps.plan.outputs.lane }}
          SLUG: ${{ steps.article.outputs.slug }}
          TITLE: ${{ steps.article.outputs.title }}
          WORDS: ${{ steps.article.outputs.words }}
          SOURCES: ${{ steps.article.outputs.sources }}
          FACTCHECK_VERDICT: ${{ steps.factcheck.outputs.verdict }}
          VERIFIED_CLAIMS: ${{ steps.factcheck.outputs.verified_claims }}
          RETRIEVED_SOURCES: ${{ steps.factcheck.outputs.retrieved_sources }}
        run: |
          set -euo pipefail
          BRANCH="analysis/auto-${LANE}-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analizi sitemap.xml analysis/monthly_usage.json analysis/verification_usage.json analysis/factcheck_report.json
          if git diff --cached --quiet; then
            echo "::error::Няма промени за публикуване."
            exit 1
          fi
          git commit -m "Publish automated editorial analysis: $SLUG"
          git push --set-upstream origin "$BRANCH"
          cat > /tmp/pr-body.md <<EOF
          ## Автоматично генериран редакционен анализ

          - Направление: **$LANE**
          - Заглавие: **$TITLE**
          - Дължина: **$WORDS думи**
          - Първоизточници в материала: **$SOURCES**
          - Независим fact-check: **$FACTCHECK_VERDICT**
          - Потвърдени твърдения: **$VERIFIED_CLAIMS**
          - Директно извлечени първични URL адреси: **$RETRIEVED_SOURCES**
          - Страница: https://bgvchisla.com/analizi/$SLUG/

          Статията е генерирана с GPT-6 Luna и проверена от отделния Google Gemini 3.8 Flash чрез директно извличане на посочените първични URL адреси (URL Context); Google Search grounding не се използва. PR може да се слее автоматично само при PASS на независимата проверка и успешен отделен CI audit. REVIEW/FAIL оставя PR отворен за редакционна намеса.
          EOF
          PR_URL="$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "Автоматичен анализ: $TITLE" --body-file /tmp/pr-body.md)"
          PR_NUMBER="$(gh pr view "$PR_URL" --repo "$REPOSITORY" --json number --jq .number)"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Block publication unless the independent fact-check passes
        if: steps.plan.outputs.mode == 'publish'
        env:
          FACTCHECK_VERDICT: ${{ steps.factcheck.outputs.verdict }}
        run: |
          if [ "$FACTCHECK_VERDICT" != "PASS" ]; then
            echo "::error::Независимата проверка върна $FACTCHECK_VERDICT. PR остава отворен; сливане и публикуване са забранени."
            exit 1
          fi

      - name: Dispatch the independent audit for the exact PR commit
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run audit-analysis-evidence.yml --repo "$REPOSITORY" --ref "$BRANCH" -f pr_number="$PR_NUMBER" -f expected_sha="$EXPECTED_SHA"

      - name: Wait for the audit check and block on any failure
        id: audit
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            CURRENT_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
            if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::PR commit-ът е променен по време на проверката."
              exit 1
            fi
            CHECKS="$(gh api "repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100")"
            AUDIT="$(jq -r '[.check_runs[] | select(.name == "audit") | select(.app.slug == "github-actions") | {status, conclusion, time:(.completed_at // .started_at // .created_at)}] | sort_by(.time) | last | [.status, (.conclusion // "")] | @tsv' <<<"$CHECKS")"
            STATUS="$(cut -f1 <<<"$AUDIT")"
            CONCLUSION="$(cut -f2 <<<"$AUDIT")"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "audit_result=success" >> "$GITHUB_OUTPUT"
                echo "Независимият audit е успешен за $EXPECTED_SHA."
                exit 0
              fi
              echo "::error::Audit приключи с резултат '$CONCLUSION'. Публикацията е блокирана."
              exit 1
            fi
            echo "Изчакване на audit: $attempt/60."
            sleep 15
          done
          echo "::error::Audit не завърши в рамките на 15 минути."
          exit 1

      - name: Verify the audit-issued machine publication gate
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "open"
          test "$(jq -r '.base.ref' <<<"$PR_JSON")" = "main"
          test "$(jq -r '.head.sha' <<<"$PR_JSON")" = "$EXPECTED_SHA"
          test "$(jq -r '.draft' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.mergeable' <<<"$PR_JSON")" = "true"
          test "$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")" = "$REPOSITORY"
          STATUSES="$(gh api "repos/$REPOSITORY/commits/$EXPECTED_SHA/statuses?per_page=100")"
          APPROVAL_STATE="$(jq -r '[.[] | select(.context == "editorial-approval")] | sort_by(.created_at) | last | .state // empty' <<<"$STATUSES")"
          if [ "$APPROVAL_STATE" != "success" ]; then
            echo "::error::Независимият audit не е издал editorial-approval за точния commit."
            exit 1
          fi
          echo "Независимият audit е издал editorial-approval=success за $EXPECTED_SHA."

      - name: Merge only the audited commit
        id: merge
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          RESULT="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$EXPECTED_SHA" -f merge_method=squash)"
          test "$(jq -r '.merged' <<<"$RESULT")" = "true"
          SHA="$(jq -r '.sha' <<<"$RESULT")"
          echo "merge_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Start production deployment
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main

      - name: Wait for successful Cloudflare Pages deployment
        if: steps.plan.outputs.mode == 'publish' && steps.factcheck.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            RUNS="$(gh run list --repo "$REPOSITORY" --workflow deploy-production.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion)"
            RUN="$(jq -c --arg sha "$MERGE_SHA" '[.[] | select(.headSha == $sha)] | first // empty' <<<"$RUNS")"
            if [ -n "$RUN" ]; then
              STATUS="$(jq -r '.status' <<<"$RUN")"
              CONCLUSION="$(jq -r '.conclusion // empty' <<<"$RUN")"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "Production deployment е потвърден."
                  exit 0
                fi
                echo "::error::Production deployment приключи с '$CONCLUSION'."
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::Няма потвърждение за production deployment в рамките на 10 минути."
          exit 1

      - name: Write the execution report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LANE: ${{ steps.plan.outputs.lane }}
          MODE: ${{ steps.plan.outputs.mode }}
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
          WORDS: ${{ steps.article.outputs.words }}
          SOURCES: ${{ steps.article.outputs.sources }}
          FACTCHECK_VERDICT: ${{ steps.factcheck.outputs.verdict }}
          VERIFIED_CLAIMS: ${{ steps.factcheck.outputs.verified_claims }}
          FACTCHECK_COST: ${{ steps.factcheck.outputs.cost_usd }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## Седмичен редакционен анализ"
            echo
            echo "- Резултат: **$JOB_STATUS**"
            echo "- Направление: **${LANE:-неопределено}**"
            echo "- Режим: **${MODE:-неопределен}**"
            if [ -n "$FACTCHECK_VERDICT" ]; then
              echo "- Независима фактологична проверка: **$FACTCHECK_VERDICT**"
              echo "- Потвърдени твърдения: ${VERIFIED_CLAIMS:-0}"
              echo "- Разход за проверката: ${FACTCHECK_COST:-неизвестен} USD"
            fi
            if [ -n "$ARTICLE_TITLE" ]; then
              echo "- Заглавие: **$ARTICLE_TITLE**"
              echo "- Страница: https://bgvchisla.com/analizi/$ARTICLE_SLUG/"
              echo "- Дължина: $WORDS думи; първоизточници: $SOURCES"
            fi
            if [ -n "$PR_URL" ]; then echo "- Контролен PR: $PR_URL"; fi
            echo
            if [ "$JOB_STATUS" = "success" ] && [ "$MODE" = "publish" ]; then
              echo "**Публикацията и production deployment са потвърдени.**"
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "Безплатният предварителен тест приключи; няма платена заявка или публикация."
              if [ -n "${{ steps.plan.outputs.reason }}" ]; then echo "Причина: ${{ steps.plan.outputs.reason }}"; fi
            else
              echo "**Публикацията е блокирана.** Виж логовете на неуспешната стъпка."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
