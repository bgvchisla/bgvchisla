name: Audit editorial evidence for analyses

on:
  push:
    branches: [main]
    paths:
      - "scripts/analysis_evidence.py"
      - "scripts/patch_analysis_evidence.py"
      - "scripts/test_frontend.py"
      - "scripts/test_analysis_publication.py"
      - "scripts/test_independent_factcheck.py"
      - "scripts/fact_check_analysis.py"
      - "scripts/apply_ai_disclosure.py"
      - "scripts/test_responsive.mjs"
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/generate-analyses.yml"
      - ".github/workflows/approve-analysis.yml"
      - ".github/workflows/audit-analysis-evidence.yml"
      - "news.json"
      - "official_fiscal.json"
      - "official_bnb.json"
      - "official_nssi.json"
      - "official_business_climate.json"
      - "economy.json"
      - "analizi/**"
      - "sitemap.xml"
      - "analysis/monthly_usage.json"
      - "analysis/verification_usage.json"
      - "analysis/README.md"
      - "analysis/config.json"
      - "PROJECT_HANDOVER.md"
      - ".github/workflows/update-news.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Internal automated PR number"
        required: false
        type: string
      expected_sha:
        description: "Exact commit SHA to approve after audit"
        required: false
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write
  checks: write

concurrency:
  group: audit-editorial-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify automated data writer security controls
        run: python scripts/test_automation_writer.py
      - name: Run regression tests for news and NSI availability
        run: |
          python scripts/test_update_news.py
          python scripts/test_update_business_climate.py
      - name: Validate mobile navigation and all inline JavaScript
        run: python scripts/test_frontend.py
      - name: Validate article evidence and publication workflow
        run: python scripts/test_analysis_publication.py
      - name: Compile independent fact-check modules
        run: python -m py_compile scripts/test_independent_factcheck.py scripts/fact_check_analysis.py scripts/apply_ai_disclosure.py
      - name: Install Chromium for exact viewport testing
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve the checked-out commit for viewport tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bgvchisla-test-server.log 2>&1 &
          echo $! >/tmp/bgvchisla-test-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local checkout server ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bgvchisla-test-server.log
          exit 1

      - name: Test checked-out commit at exact CSS viewport sizes
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node scripts/test_responsive.mjs
      - name: Validate checked-in datasets and Python syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data.json", "economy.json", "news.json", "source_status.json",
              "official_fiscal.json", "official_bnb.json", "official_nssi.json",
              "official_business_climate.json", "analysis/monthly_usage.json",
              "analysis/verification_usage.json", "analizi/articles.json",
          ]
          for name in required:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Required dataset is missing: {name}")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {name}")
          PY
          python -m py_compile scripts/update_news.py scripts/update_business_climate.py scripts/update_bnb_monetary.py scripts/update_economy.py scripts/update_nsi_fiscal.py scripts/update_nssi_pensions.py scripts/analysis_evidence.py scripts/patch_analysis_evidence.py scripts/test_analysis_publication.py scripts/test_independent_factcheck.py scripts/fact_check_analysis.py scripts/apply_ai_disclosure.py
      - name: Prepare the same runtime used by production
        run: |
          gzip -dc scripts/generate_analysis.py.gz > scripts/generate_analysis.py
          python scripts/patch_analysis_evidence.py
          python -m py_compile scripts/generate_analysis.py scripts/analysis_evidence.py
      - name: Audit Bulgarian analysis evidence without an API call
        run: python scripts/analysis_evidence.py --lane bulgaria
      - name: Audit world analysis evidence without an API call
        run: python scripts/analysis_evidence.py --lane world
      - name: Run independent fact-check integrity tests
        run: python scripts/test_independent_factcheck.py --static
      - name: Validate external fact-check report when present
        run: |
          if [ -f analysis/factcheck_report.json ]; then
            python scripts/test_independent_factcheck.py --report analysis/factcheck_report.json
          fi
      - name: Run the actual Bulgarian free preflight
        run: python scripts/generate_analysis.py --lane bulgaria --dry-run
      - name: Run the actual world free preflight
        run: python scripts/generate_analysis.py --lane world --dry-run
      - name: Verify monthly spend ledger remains unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          usage = json.loads(Path("analysis/monthly_usage.json").read_text(encoding="utf-8"))
          config = json.loads(Path("analysis/config.json").read_text(encoding="utf-8"))
          calls = usage.get("calls", 0)
          spent = usage.get("spent_usd", 0)
          assert isinstance(calls, int) and calls >= 0, "Invalid monthly API call count."
          assert isinstance(spent, (int, float)) and spent >= 0, "Invalid monthly spend value."
          assert calls <= config.get("max_api_calls_per_month", 0), "Monthly API call limit exceeded."
          assert spent <= config.get("monthly_budget_usd", 0), "Monthly analysis budget exceeded."
          print(f"Проверка на бюджетния регистър: {calls} заявки; {spent:.6f} USD; в зададените лимити.")
          PY

      - name: Record machine approval only for a validated internal automation PR
        if: >-
          success() &&
          (
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                startsWith(github.head_ref, 'analysis/auto-') ||
                startsWith(github.head_ref, 'automation/full-auto-editorial-pipeline-') ||
                startsWith(github.head_ref, 'automation/independent-ai-factcheck-') ||
                startsWith(github.head_ref, 'automation/fix-chart-numeric-') ||
                startsWith(github.head_ref, 'fix/debt-counter-') ||
                startsWith(github.head_ref, 'fix/news-ui-enforces-publisher-diversity-') ||
                startsWith(github.head_ref, 'fix/news-more-divider-') ||
                startsWith(github.head_ref, 'fix/navigation-labels-desktop-news-mobile-only-')
              )
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.pr_number != '' &&
              inputs.expected_sha != '' &&
              (
                startsWith(github.ref_name, 'analysis/auto-') ||
                startsWith(github.ref_name, 'automation/full-auto-editorial-pipeline-') ||
                startsWith(github.ref_name, 'automation/independent-ai-factcheck-') ||
                startsWith(github.ref_name, 'automation/fix-chart-numeric-') ||
                startsWith(github.ref_name, 'fix/debt-counter-') ||
                startsWith(github.ref_name, 'fix/news-ui-enforces-publisher-diversity-') ||
                startsWith(github.ref_name, 'fix/news-more-divider-') ||
                startsWith(github.ref_name, 'fix/navigation-labels-desktop-news-mobile-only-')
              )
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          # The independent audit above must finish successfully before this step runs.
          # Only exact in-repository automation branches may receive the machine status.
          case "$HEAD_BRANCH" in
            analysis/auto-*|automation/full-auto-editorial-pipeline-*|automation/independent-ai-factcheck-*|automation/fix-chart-numeric-*|fix/debt-counter-*|fix/news-ui-enforces-publisher-diversity-*|fix/news-more-divider-*|fix/navigation-labels-desktop-news-mobile-only-*) ;;
            *) echo "No automatic editorial approval for this branch."; exit 0 ;;
          esac
          test "$HEAD_REPOSITORY" = "$REPOSITORY"

          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "open"
          test "$(jq -r '.base.ref' <<<"$PR_JSON")" = "main"
          test "$(jq -r '.head.ref' <<<"$PR_JSON")" = "$HEAD_BRANCH"
          test "$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")" = "$REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$PR_JSON")" = "$EXPECTED_SHA"
          test "$(jq -r '.draft' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.mergeable' <<<"$PR_JSON")" = "true"

          STATUS_RESULT="$(gh api --method POST "repos/$REPOSITORY/statuses/$EXPECTED_SHA" -f state=success -f context=editorial-approval -f description="Independent audit passed; internal automation PR validated for exact SHA" -f target_url="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.context' <<<"$STATUS_RESULT")" = "editorial-approval"
          test "$(jq -r '.state' <<<"$STATUS_RESULT")" = "success"

          # Rulesets that pin a required status check to the GitHub Actions
          # integration consume a native Check Run. Publish the same exact-SHA
          # approval as a Check Run as well as the legacy commit status.
          CHECK_RESULT="$(gh api --method POST "repos/$REPOSITORY/check-runs" \
            -f name=editorial-approval \
            -f head_sha="$EXPECTED_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f "output[title]=Independent editorial approval" \
            -f "output[summary]=The separate audit job passed for this exact commit SHA. No human editorial review is implied.")"
          test "$(jq -r '.name' <<<"$CHECK_RESULT")" = "editorial-approval"
          test "$(jq -r '.head_sha' <<<"$CHECK_RESULT")" = "$EXPECTED_SHA"
          test "$(jq -r '.conclusion' <<<"$CHECK_RESULT")" = "success"
          echo "Machine editorial approval recorded as both a commit status and a native Check Run for $EXPECTED_SHA."
