name: Update economic statistics
on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - "scripts/update_economy.py"
      - ".github/workflows/update-economy.yml"
permissions:
  contents: write
concurrency:
  group: economy-development
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate Eurostat series
        run: python scripts/update_economy.py
      - name: Save validated economy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economy.json
          if git diff --cached --quiet; then
            echo "No economy data changes."
          else
            git commit -m "Update economic statistics"
            git push origin HEAD:development
          fi
