name: Update official NSI inflation data

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_inflation.py"
      - "scripts/test_inflation_data.py"
      - ".github/workflows/update-inflation.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline NSI inflation regression tests
        run: python scripts/test_inflation_data.py

      - name: Import and validate the latest final NSI release
        run: python scripts/update_inflation.py

      - name: Validate the published inflation dataset
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("inflation.json").read_text(encoding="utf-8"))
          latest = data.get("latest", {})
          history = data.get("history", [])
          categories = data.get("cpi_categories", [])
          period = data.get("latest_period", "")
          if not period or len(period) != 7 or period[4] != "-":
              raise SystemExit("Invalid latest_period in inflation.json")
          if not history or history[-1].get("period") != period:
              raise SystemExit("History does not end in latest_period")
          if len(categories) < 10:
              raise SystemExit("Too few CPI categories; refusing to publish")
          for indicator in ("cpi", "hicp"):
              for key in ("monthly", "annual", "ytd", "annual_average", "accumulated_3y", "accumulated_5y"):
                  value = latest.get(indicator, {}).get(key)
                  if not isinstance(value, (int, float)) or not math.isfinite(value):
                      raise SystemExit(f"Invalid {indicator}.{key}")
          basket = latest.get("small_basket", {})
          for key in ("monthly", "annual"):
              value = basket.get(key)
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"Invalid small_basket.{key}")
          print(f"Validated NSI inflation data for {period}: {len(history)} months, {len(categories)} CPI groups.")
          PY

      - name: Save only validated data changes
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("inflation.json")
          new = json.loads(path.read_text(encoding="utf-8"))
          old = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:inflation.json"], text=True
          ))

          def comparable(data):
              data.pop("last_updated", None)
              return data

          if comparable(new) == comparable(old):
              subprocess.check_call(["git", "checkout", "--", "inflation.json"])
              print("No new official observations; keeping the last published file.")
          else:
              print("New official inflation observations or source revisions detected.")
          PY
          APP_SLUG="${{ steps.automation_token.outputs.app-slug }}"
          if [ -n "$APP_SLUG" ]; then
            BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add inflation.json
          if git diff --cached --quiet; then
            echo "No inflation data changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update official NSI inflation data"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Inflation data pushed successfully."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 safe attempts."
              exit 1
            fi
            echo "Push race detected; rebasing on the latest main (attempt $attempt/3)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict detected; refusing to overwrite concurrent changes."
              exit 1
            fi
          done

      - name: Dispatch production deployment after data changes
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main
          echo "Production deployment requested for validated inflation data."
