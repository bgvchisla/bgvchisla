name: Update official NSI inflation data

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_inflation.py"
      - "scripts/test_inflation_data.py"
      - ".github/workflows/update-inflation.yml"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline NSI inflation regression tests
        run: python scripts/test_inflation_data.py

      - name: Import and validate the latest final NSI release
        run: python scripts/update_inflation.py

      - name: Validate the published inflation dataset
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("inflation.json").read_text(encoding="utf-8"))
          latest = data.get("latest", {})
          history = data.get("history", [])
          categories = data.get("cpi_categories", [])
          period = data.get("latest_period", "")
          if not period or len(period) != 7 or period[4] != "-":
              raise SystemExit("Invalid latest_period in inflation.json")
          if not history or history[-1].get("period") != period:
              raise SystemExit("History does not end in latest_period")
          if len(categories) < 10:
              raise SystemExit("Too few CPI categories; refusing to publish")
          for indicator in ("cpi", "hicp"):
              for key in ("monthly", "annual", "ytd", "annual_average", "accumulated_3y", "accumulated_5y"):
                  value = latest.get(indicator, {}).get(key)
                  if not isinstance(value, (int, float)) or not math.isfinite(value):
                      raise SystemExit(f"Invalid {indicator}.{key}")
          basket = latest.get("small_basket", {})
          for key in ("monthly", "annual"):
              value = basket.get(key)
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"Invalid small_basket.{key}")
          print(f"Validated NSI inflation data for {period}: {len(history)} months, {len(categories)} CPI groups.")
          PY

      - name: Create a pull request for validated data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          APP_SLUG: ${{ steps.automation_token.outputs.app-slug }}
        run: bash scripts/create_data_update_pr.sh inflation.json "Update official NSI inflation data"
