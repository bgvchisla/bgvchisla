name: Daily data update

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Eurostat data
        run: python scripts/update_economy.py

      - name: Require a complete, valid refresh
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json.loads(Path("data.json").read_text(encoding="utf-8"))
          data = json.loads(Path("economy.json").read_text(encoding="utf-8"))
          status = data.get("update_status", {})
          expected = status.get("configured_series")
          successful = status.get("successful_series", [])
          if status.get("status") != "ok" or not expected or len(successful) != expected:
              raise SystemExit(f"Eurostat refresh incomplete: {len(successful)}/{expected} series succeeded")
          by_id = {row["id"]: row for row in data.get("series", [])}
          for series_id in successful:
              points = by_id.get(series_id, {}).get("points", [])
              years = [point["year"] for point in points]
              if len(points) < 2 or years != sorted(set(years)):
                  raise SystemExit(f"Invalid series: {series_id}")
          print(f"Validated all {len(successful)} Eurostat series.")
          PY

      - name: Ignore timestamp-only changes
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open("economy.json", encoding="utf-8") as file:
              new = json.load(file)

          old = json.loads(
              subprocess.check_output(["git", "show", "HEAD:economy.json"]).decode("utf-8")
          )

          def clean(data):
              data.pop("updated_at", None)
              for row in data.get("series", []):
                  row.pop("updated_at", None)
              return data

          if clean(new) == clean(old):
              subprocess.check_call(["git", "checkout", "--", "economy.json"])
              print("Only the timestamp changed. File restored.")
          else:
              print("Real data change found.")
          PY

      - name: Create a pull request for validated data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          APP_SLUG: ${{ steps.automation_token.outputs.app-slug }}
        run: bash scripts/create_data_update_pr.sh economy.json "Update official Eurostat series"
