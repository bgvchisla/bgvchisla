name: Update official NSI business climate (validated v2)
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_business_climate.py"
      - ".github/workflows/update-business-climate.yml"
permissions:
  contents: write
concurrency:
  group: update-business-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import and validate official NSI indicators
        run: python scripts/update_business_climate.py
      - name: Commit changed dataset
        run: |
          git add -f official_business_climate.json
          if git diff --cached --quiet -- official_business_climate.json; then
            echo "No business-climate data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update official NSI business climate data"
            git pull --rebase origin main
            git push
          fi
