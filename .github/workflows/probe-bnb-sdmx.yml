name: Probe official BNB SDMX source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_bnb_sdmx.py"
      - ".github/workflows/probe-bnb-sdmx.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Inspect official BNB monetary-statistics workbook
        run: python scripts/probe_bnb_sdmx.py
