name: Update official NSI fiscal data

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_nsi_fiscal.py"
      - ".github/workflows/update-nsi-fiscal.yml"

permissions:
  contents: write

concurrency:
  group: official-nsi-fiscal-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Import and validate NSI monthly fiscal data
        run: python scripts/update_nsi_fiscal.py
      - name: Commit changed official data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official_fiscal.json
          if git diff --cached --quiet; then
            echo "No changes in NSI fiscal observations."
          else
            git commit -m "Update official NSI monthly fiscal data"
            git push origin HEAD:main
          fi
      - name: Prepare production files
        run: |
          mkdir -p public
          cp index.html data.json economy.json economy-charts.js privacy.html news.json source_status.json official_fiscal.json public/
      - name: Deploy official data
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=main
