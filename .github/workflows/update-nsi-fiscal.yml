name: Update official NSI fiscal data

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_nsi_fiscal.py"
      - ".github/workflows/update-nsi-fiscal.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Import and validate NSI monthly fiscal data
        run: python scripts/update_nsi_fiscal.py
      - name: Commit changed official data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
        run: |
          APP_SLUG="${{ steps.automation_token.outputs.app-slug }}"
          if [ -n "$APP_SLUG" ]; then
            BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add official_fiscal.json
          if git diff --cached --quiet; then
            echo "No changes in NSI fiscal observations."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update official NSI monthly fiscal data"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch production deployment after data changes
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main
          echo "Production deployment requested for the validated data update."
