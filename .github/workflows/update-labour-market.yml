name: Update live Employment Agency vacancy count

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_labour_market.py"
      - "scripts/test_update_labour_market.py"
      - ".github/workflows/update-labour-market.yml"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: labour-market-live-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the vacancy snapshot parser offline
        run: python scripts/test_update_labour_market.py
      - name: Import the current official vacancy listing
        run: python scripts/update_labour_market.py
      - name: Validate the updated dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          data = json.loads(Path("labour-market.json").read_text(encoding="utf-8"))
          vacancy = data["active_vacancies"]
          if not vacancy.get("as_of") or not isinstance(vacancy.get("count"), int):
              raise SystemExit("Invalid vacancy snapshot")
          source = urlparse(vacancy["source_url"])
          if (
              source.scheme != "https"
              or source.hostname not in {"az.government.bg", "www.az.government.bg"}
              or source.path != "/bg/ejobs/view_prl/"
          ):
              raise SystemExit("Unexpected vacancy data source")
          print(f"Validated {vacancy['count']} open positions as of {vacancy['as_of']}.")
          PY
      - name: Create a pull request for validated data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          APP_SLUG: ${{ steps.automation_token.outputs.app-slug }}
        run: bash scripts/create_data_update_pr.sh labour-market.json "Update Employment Agency vacancy count"
