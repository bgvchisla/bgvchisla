name: Update official BNB monetary and credit data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_bnb_monetary.py"
      - ".github/workflows/update-bnb-monetary.yml"

permissions:
  contents: write

concurrency:
  group: update-bnb-monetary
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Import and validate official BNB data
        run: python scripts/update_bnb_monetary.py
      - name: Commit updated dataset
        run: |
          if git diff --quiet -- official_bnb.json; then
            echo "No BNB data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add official_bnb.json
            git commit -m "Update official BNB monetary data"
            git push
          fi
