name: Update official BNB monetary and credit data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_bnb_monetary.py"
      - ".github/workflows/update-bnb-monetary.yml"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Import and validate official BNB data
        run: python scripts/update_bnb_monetary.py
      - name: Create a pull request for validated data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          APP_SLUG: ${{ steps.automation_token.outputs.app-slug }}
        run: bash scripts/create_data_update_pr.sh official_bnb.json "Update official BNB monetary data"
