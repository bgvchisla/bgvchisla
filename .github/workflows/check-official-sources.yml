name: Check official Bulgarian data sources

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_official_sources.py"
      - ".github/workflows/check-official-sources.yml"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source pages
        run: python scripts/check_official_sources.py
      - name: Create a pull request for validated data
        id: save
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          APP_SLUG: ${{ steps.automation_token.outputs.app-slug }}
        run: bash scripts/create_data_update_pr.sh source_status.json "Check official Bulgarian data sources"
