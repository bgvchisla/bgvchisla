name: Check official Bulgarian data sources

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_official_sources.py"
      - ".github/workflows/check-official-sources.yml"

permissions:
  contents: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source pages
        run: python scripts/check_official_sources.py
      - name: Save source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_status.json
          if git diff --cached --quiet; then
            echo "No source status changes."
          else
            git commit -m "Check official Bulgarian data sources"
            git push origin HEAD:main
          fi
      - name: Prepare production files
        run: |
          mkdir -p public
          cp index.html data.json economy.json economy-charts.js privacy.html news.json source_status.json public/

      - name: Deploy source status
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=main
