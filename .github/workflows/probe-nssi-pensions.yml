name: Inspect official NSSI pension workbook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd
      - name: Inspect latest NSSI pension bulletin
        run: python scripts/probe_nssi_pensions.py
