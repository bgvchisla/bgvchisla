name: Update official NSSI pension data
# Recovery run after validating the importer output format.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 5,20 * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_nssi_pensions.py"
      - ".github/workflows/update-nssi-pensions.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: production-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check xlrd
      - name: Import and validate official NSSI data
        run: python scripts/update_nssi_pensions.py
      - name: Commit updated dataset
        id: save
        run: |
          git add -f official_nssi.json
          if git diff --cached --quiet -- official_nssi.json; then
            echo "No NSSI data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            APP_SLUG="${{ steps.automation_token.outputs.app-slug }}"
            if [ -n "$APP_SLUG" ]; then
              BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
              git config user.name "${APP_SLUG}[bot]"
              git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            fi
            git commit -m "Update official NSSI pension data"
            # Rebase on any concurrent documentation or deployment commits.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch production deployment after data changes
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main
          echo "Production deployment requested for the validated data update."

# Historical bulletin import validated against the official NSSI archive.
