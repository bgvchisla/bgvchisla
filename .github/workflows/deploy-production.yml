name: Deploy production to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate data files
        run: |
          python3 -c "import json; json.load(open('data.json', encoding='utf-8')); json.load(open('economy.json', encoding='utf-8')); print('JSON OK')"
          test -f index.html
          test -f economy-charts.js
          test -f privacy.html
          python3 -c "import json; json.load(open('news.json', encoding='utf-8')); print('News JSON OK')"

      - name: Prepare files
        run: |
          mkdir public
          cp index.html data.json economy.json economy-charts.js privacy.html news.json public/

      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=main
