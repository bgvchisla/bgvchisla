name: Deploy production to Cloudflare Pages
# Publish after validated NSSI dataset refresh.
# Production release pipeline for validated portal assets and live data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "analizi/**"
      - "privacy.html"
      - "sitemap.xml"
      - "advertise.html"
      - "pazar-na-truda/**"
      - "labour-market.json"
      - ".github/workflows/update-business-climate.yml"
      - "scripts/update_nssi_pensions.py"
      - ".github/workflows/update-nssi-pensions.yml"
      - "scripts/update_bnb_monetary.py"
      - "economy-charts.js"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate data files
        run: |
          python3 -c "import json; json.load(open('data.json', encoding='utf-8')); json.load(open('economy.json', encoding='utf-8')); print('JSON OK')"
          test -f index.html
          test -f assets/design-system.css
          test -f economy-charts.js
          test -f privacy.html
          test -f source_status.json
          test -f pazar-na-truda/index.html
          python3 -c "import json; json.load(open('labour-market.json', encoding='utf-8')); print('Labour market JSON OK')"
          python3 -c "import json; json.load(open('source_status.json', encoding='utf-8')); json.load(open('official_fiscal.json', encoding='utf-8')); json.load(open('official_bnb.json', encoding='utf-8')); json.load(open('official_nssi.json', encoding='utf-8')); json.load(open('official_business_climate.json', encoding='utf-8')); print('Official data JSON OK')"
          python3 -c "import json; json.load(open('news.json', encoding='utf-8')); print('News JSON OK')"

      - name: Prepare files
        run: |
          mkdir -p public/assets
          cp -R assets/. public/assets/
          mkdir -p public
          cp index.html advertise.html data.json economy.json economy-charts.js privacy.html robots.txt sitemap.xml news.json source_status.json official_fiscal.json official_bnb.json official_nssi.json official_business_climate.json labour-market.json _headers public/
          mkdir -p public/analizi
          cp -R analizi/. public/analizi/
          mkdir -p public/pazar-na-truda
          cp -R pazar-na-truda/. public/pazar-na-truda/

      - name: Verify production artifact
        run: |
          set -euo pipefail
          test -s public/pazar-na-truda/index.html
          test -s public/labour-market.json
          python3 -c "import json; d=json.load(open('public/labour-market.json', encoding='utf-8')); assert d.get('schema_version') == 1; assert d.get('active_vacancies', {}).get('as_of'); print('Labour market production artifact OK')"

      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=main
