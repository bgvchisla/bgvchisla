name: Deploy production to Cloudflare Pages
# Publish after validated NSSI dataset refresh.
# Production release pipeline for validated portal assets and live data

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update institutional news feeds"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "news.json"
      - "source_status.json"
      - "official_fiscal.json"
      - "official_bnb.json"
      - "official_nssi.json"
      - "official_business_climate.json"
      - ".github/workflows/update-business-climate.yml"
      - "scripts/update_nssi_pensions.py"
      - ".github/workflows/update-nssi-pensions.yml"
      - "scripts/update_bnb_monetary.py"
      - "economy.json"
      - "economy-charts.js"
      - "data.json"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether the news refresh changed news.json
        id: news_change
        if: github.event_name == 'workflow_run'
        env:
          NEWS_REFRESH_BASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --quiet "$NEWS_REFRESH_BASE" HEAD -- news.json; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No published news changes; skipping deployment."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "news.json changed after the scheduled news refresh; deployment required."
          fi

      - name: Validate data files
        run: |
          python3 -c "import json; json.load(open('data.json', encoding='utf-8')); json.load(open('economy.json', encoding='utf-8')); print('JSON OK')"
          test -f index.html
          test -f economy-charts.js
          test -f privacy.html
          test -f source_status.json
          python3 -c "import json; json.load(open('source_status.json', encoding='utf-8')); json.load(open('official_fiscal.json', encoding='utf-8')); json.load(open('official_bnb.json', encoding='utf-8')); json.load(open('official_nssi.json', encoding='utf-8')); json.load(open('official_business_climate.json', encoding='utf-8')); print('Official data JSON OK')"
          python3 -c "import json; json.load(open('news.json', encoding='utf-8')); print('News JSON OK')"

      - name: Prepare files
        run: |
          mkdir public
          cp index.html data.json economy.json economy-charts.js privacy.html news.json source_status.json official_fiscal.json official_bnb.json official_nssi.json official_business_climate.json public/

      - name: Deploy production
        if: github.event_name != 'workflow_run' || steps.news_change.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=main
