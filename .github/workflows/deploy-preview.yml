name: Deploy preview to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - ".github/workflows/deploy-preview.yml"
      - "index.html"
      - "privacy.html"
      - "news.json"
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development

      - name: Prepare files
        run: |
          mkdir public
          cp index.html privacy.html data.json economy.json economy-charts.js news.json x-test.html public/

      - name: Deploy preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bgvchisla --branch=development
