name: Approve and publish repository changes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
  statuses: write

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/approve' &&
      github.actor == 'bgvchisla'
    runs-on: ubuntu-latest
    steps:
      - name: Validate, record owner approval and merge the exact PR revision
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          MERGEABLE="$(jq -r '.mergeable' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"

          if [ "$STATE" != "open" ]; then
            echo "Approval refused: the pull request is not open."
            exit 1
          fi
          if [ "$BASE_REF" != "main" ]; then
            echo "Approval refused: the pull request does not target main."
            exit 1
          fi
          if [ -z "$HEAD_REF" ] || [ "$HEAD_REF" = "main" ]; then
            echo "Approval refused: invalid source branch."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo "Approval refused: the PR branch is not in the canonical repository."
            exit 1
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "Approval refused: mark the pull request ready for review first."
            exit 1
          fi
          if [ "$MERGEABLE" != "true" ]; then
            echo "Approval refused: GitHub does not currently consider this PR mergeable."
            exit 1
          fi

          CHECKS="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")"
          AUDIT_RESULT="$(jq -r '[.check_runs[] | select(.name == "audit") | select(.app.slug == "github-actions") | select(.status == "completed") | {time:(.completed_at // .started_at // .created_at), conclusion:.conclusion}] | sort_by(.time) | last | .conclusion // empty' <<<"$CHECKS")"
          if [ "$AUDIT_RESULT" != "success" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Сливането е спряно: проверката audit за последния commit не е успешна. Изчакай зелен резултат и повтори /approve."
            echo "Approval refused: audit is not successful for $HEAD_SHA."
            exit 1
          fi

          # Re-fetch immediately before granting the required status and merging.
          PR_REFRESH="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          CURRENT_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_REFRESH")"
          CURRENT_STATE="$(jq -r '.state' <<<"$PR_REFRESH")"
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ] || [ "$CURRENT_STATE" != "open" ]; then
            echo "Approval refused: the PR changed while checks were being verified. Review and approve the newest revision."
            exit 1
          fi

          # The required status is created only after owner approval and a green audit on this exact SHA.
          APPROVAL_URL="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          STATUS_RESULT="$(gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context=editorial-approval -f description="Owner approved this exact revision via /approve" -f target_url="$APPROVAL_URL")"
          STATUS_CONTEXT="$(jq -r '.context' <<<"$STATUS_RESULT")"
          STATUS_STATE="$(jq -r '.state' <<<"$STATUS_RESULT")"
          if [ "$STATUS_CONTEXT" != "editorial-approval" ] || [ "$STATUS_STATE" != "success" ]; then
            echo "Approval refused: GitHub did not record the required editorial-approval status."
            exit 1
          fi

          # The SHA precondition prevents merging an untested newer revision.
          if ! MERGE_RESULT="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$HEAD_SHA" -f merge_method=squash 2>/tmp/merge-error.txt)"; then
            gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" -f state=failure -f context=editorial-approval -f description="Approval recorded, but the protected merge did not complete" -f target_url="$APPROVAL_URL" >/dev/null || true
            cat /tmp/merge-error.txt >&2
            exit 1
          fi
          MERGED="$(jq -r '.merged' <<<"$MERGE_RESULT")"
          if [ "$MERGED" != "true" ]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" -f state=failure -f context=editorial-approval -f description="GitHub did not confirm the merge" -f target_url="$APPROVAL_URL" >/dev/null || true
            echo "Approval failed: GitHub did not confirm the merge."
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Owner approval, exact-SHA audit and SHA-checked squash merge completed for $HEAD_SHA."
      - name: Dispatch production deployment
        if: steps.approval.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A merge made with GITHUB_TOKEN does not start a push-triggered workflow.
          # Dispatch production deployment explicitly after the approved merge.
          gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main
          echo "Production deployment dispatched."
