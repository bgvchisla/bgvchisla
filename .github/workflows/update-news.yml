name: Update institutional news feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate RSS/Atom headlines
        run: python scripts/update_news.py
      - name: Validate feed health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("news.json").read_text(encoding="utf-8"))
          status = data.get("feed_status", {})
          ok, total = status.get("ok", 0), status.get("total", 0)
          if not data.get("items"):
              raise SystemExit("No news items available; refusing to publish an empty feed.")
          if total < 1 or ok < max(8, (total + 1) // 2):
              raise SystemExit(f"Too many failed news sources: {ok}/{total} succeeded.")
          print(f"News feed health: {ok}/{total} sources succeeded; {len(data['items'])} items.")
          PY

      - name: Save news.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("news.json")
          new = json.loads(path.read_text(encoding="utf-8"))
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:news.json"], text=True))

          def comparable(data):
              data.pop("updated_at", None)
              return data

          if comparable(new) == comparable(old):
              subprocess.check_call(["git", "checkout", "--", "news.json"])
              print("No new headlines or feed-status changes.")
          else:
              print("New headlines or feed-status changes detected.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to publish."
          else
            git commit -m "Update institutional news feeds"
            git push origin HEAD:main
          fi
