name: Update institutional news feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - "scripts/test_update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped automation App token
        id: automation_token
        if: vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.BGVCHISLA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BGVCHISLA_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.automation_token.outputs.token || github.token }}
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test news selection and chronological ordering
        run: python scripts/test_update_news.py
      - name: Fetch and validate RSS/Atom headlines
        run: python scripts/update_news.py
      - name: Validate feed health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("news.json").read_text(encoding="utf-8"))
          status = data.get("feed_status", {})
          ok, total = status.get("ok", 0), status.get("total", 0)
          if not data.get("items"):
              raise SystemExit("No news items available; refusing to publish an empty feed.")
          if total < 1 or ok < max(8, (total + 1) // 2):
              raise SystemExit(f"Too many failed news sources: {ok}/{total} succeeded.")
          print(f"News feed health: {ok}/{total} sources succeeded; {len(data['items'])} items.")
          PY

      - name: Save news.json to main
        id: save
        run: |
          APP_SLUG="${{ steps.automation_token.outputs.app-slug }}"
          if [ -n "$APP_SLUG" ]; then
            BOT_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("news.json")
          new = json.loads(path.read_text(encoding="utf-8"))
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:news.json"], text=True))

          def comparable(data):
              data.pop("updated_at", None)
              return data

          if comparable(new) == comparable(old):
              subprocess.check_call(["git", "checkout", "--", "news.json"])
              print("No new headlines or feed-status changes.")
          else:
              print("New headlines or feed-status changes detected.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update institutional news feeds"

          # Други автоматични задачи също могат да запишат в main.
          # При отказ за fast-forward интегрираме техните commit-и чрез rebase.
          # Не използваме force push и не презаписваме отдалечения клон.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "News update pushed successfully."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 safe attempts."
              exit 1
            fi

            echo "Push race detected. Fetching the latest main and rebasing (attempt $attempt/3)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict detected. Refusing to overwrite concurrent changes."
              exit 1
            fi
          done

      - name: Dispatch production deployment after data changes
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --repo "$REPOSITORY" --ref main
          echo "Production deployment requested for the validated data update."
